/* Project photographs and build videos: September 2026 media integration. */
.detail-cover.photograph { background: var(--sage); }
.detail-cover.photograph > img { height: clamp(340px, 52vw, 660px); object-fit: contain; }
.detail-cover.photograph figcaption { background: rgba(248, 247, 243, .96); }
.media-jumps { display: flex; flex-wrap: wrap; gap: 12px 30px; margin-top: 22px; }
.gallery-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
.gallery-heading .mono { font-size: 11px; color: var(--muted); white-space: nowrap; }
.prose .gallery-help { font-size: 13px; margin: -3px 0 22px; }
.gallery > figure { min-width: 0; }
.gallery-open { display: block; position: relative; background: var(--sage); overflow: hidden; }
.gallery .gallery-open img { width: 100%; height: 255px; object-fit: contain; transition: transform .2s; }
.gallery-open:hover img { transform: scale(1.015); }
.gallery-expand { position: absolute; right: 10px; bottom: 10px; width: 29px; height: 29px; background: var(--paper); color: var(--ink); display: grid; place-items: center; font-size: 20px; line-height: 1; }
.gallery figcaption { line-height: 1.55; padding-top: 11px; }
.gallery-more { border-top: 1px solid var(--line); margin-top: 26px; }
.gallery-more > summary { display: flex; justify-content: space-between; gap: 20px; padding: 17px 0; cursor: pointer; font-size: 14px; color: var(--ink); list-style: none; }
.gallery-more > summary::-webkit-details-marker { display: none; }
.gallery-more[open] > summary span { transform: rotate(45deg); }
.gallery-more[open] > .gallery { margin-top: 8px; }
.live-photo { margin-top: 9px; }
.live-photo summary { cursor: pointer; font-size: 11px; color: var(--accent); }
.live-photo video { display: block; width: 100%; max-height: 360px; margin-top: 9px; background: var(--ink); }
.video-section { border-top: 1px solid var(--line); padding-top: 30px; }
.video-gallery { display: grid; gap: 28px; }
.video-figure video { display: block; width: 100%; height: auto; max-height: 580px; object-fit: contain; background: var(--dark); }
.video-figure figcaption { font-size: 12px; color: var(--muted); padding-top: 12px; line-height: 1.6; }
.lightbox-actions { display: flex; gap: 20px; align-items: center; }
.lightbox-actions a { color: inherit; text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }
.lightbox-image { width: 100%; object-fit: contain; }
.lightbox-controls button { min-width: 44px; min-height: 44px; }
@media (max-width: 620px) {
 .detail-cover.photograph > img { height: 400px; }
 .gallery .gallery-open img { height: 210px; }
 .gallery-heading .mono { font-size: 10px; }
 .lightbox-actions { gap: 12px; }
 .lightbox-actions a { font-size: 10px; }
 .lightbox-toolbar { padding: 10px; gap: 10px; }
 .media-jumps { margin-top: 16px; gap: 10px 23px; }
 .media-jumps .text-link { font-size: 13px; }
 .video-figure video { max-height: 470px; }
}
@media (max-width: 380px) {
 .gallery { grid-template-columns: 1fr; }
 .gallery .gallery-open img { height: 275px; }
 .lightbox-actions a { max-width: 76px; line-height: 1.3; }
}
@media (prefers-reduced-motion: reduce) {
 .gallery-open:hover img { transform: none; }
}
@media print {
 .media-jumps, .live-photo, .video-section { display: none; }
 .gallery-expand { display: none; }
 .detail-cover.photograph > img { height: 280px; }
}
